name: Build and deploy

on:
  push:
    branches: [main]

jobs:
  build-arm64:
    # Runner natif arm64 (cible : le Pi). QEMU plantait sur les binaires natifs
    # de Next.js (SWC) - "qemu: uncaught target signal 4 (Illegal instruction)" -
    # un runner nativement arm64 élimine le problème, pas d'émulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/vh7383/hernandes.cloud:sha-${{ github.sha }}-arm64

  build-amd64:
    # Runner natif amd64 (cible : le VPS OVH). Même logique que build-arm64 :
    # natif plutôt que QEMU, pour la même raison (binaires natifs SWC).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/vh7383/hernandes.cloud:sha-${{ github.sha }}-amd64

  merge-manifest:
    # Combine les deux images arch-spécifiques en un seul manifeste multi-arch :
    # un `docker pull ghcr.io/.../hernandes.cloud:latest` récupère automatiquement
    # la bonne architecture, que ce soit sur le Pi ou sur le VPS.
    needs: [build-arm64, build-amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Créer le manifeste multi-arch
        run: |
          docker buildx imagetools create \
            -t ghcr.io/vh7383/hernandes.cloud:latest \
            -t ghcr.io/vh7383/hernandes.cloud:${{ github.sha }} \
            ghcr.io/vh7383/hernandes.cloud:sha-${{ github.sha }}-arm64 \
            ghcr.io/vh7383/hernandes.cloud:sha-${{ github.sha }}-amd64

  deploy:
    needs: merge-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le Pi via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            cd /opt/hernandes-cloud
            docker compose pull
            docker compose up -d

  # kb.hernandes.cloud a demenage vers son propre depot dedie et sa propre
  # CI (github.com/vh7383/kb.hernandes.cloud) -- plus de job ici, cf.
  # docs/decisions.md.